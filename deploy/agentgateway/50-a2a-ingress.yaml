# Ingress: chats to agents (kagent's A2A gRPC service) enter through the
# gateway too, so every request in and out of a sandbox crosses agentgateway.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: kagent-a2a
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    # All of kagent's gRPC (A2A chats plus the session lookup and health
    # check its clients make first) goes through the gateway.
    - backendRefs:
        - name: kagent-controller
          namespace: kagent
          port: 8083
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: agentgateway-to-kagent
  namespace: kagent
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: agentgateway-system
  to:
    - group: ""
      kind: Service
      name: kagent-controller
