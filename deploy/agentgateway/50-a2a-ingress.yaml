# Ingress: chats to agents enter through the gateway's a2a-ingress listener
# (port 8081), which sandboxes are not allowed to reach. Only what a chat
# needs is routed: the A2A service, the session lookup the client does first,
# and health checks. The rest of kagent's API stays off the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: kagent-a2a
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      sectionName: a2a-ingress
  rules:
    - matches:
        - method:
            service: lf.a2a.v1.A2AService
        - method:
            service: kagent.api.v1.SessionService
            method: GetSession
        - method:
            service: grpc.health.v1.Health
            method: Check
      backendRefs:
        - name: kagent-controller
          namespace: kagent
          port: 8083
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: agentgateway-to-kagent
  namespace: kagent
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: agentgateway-system
  to:
    - group: ""
      kind: Service
      name: kagent-controller
