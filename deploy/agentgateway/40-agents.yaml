# Every agent reaches the outside world only through agentgateway:
#  - one shared model: kagent's default-model-config, set by `make
#    agentgateway` to your qwen3:8b via the gateway's /qwen route, with only a
#    placeholder key in kagent (the gateway holds any real credentials)
#  - its tools come from kagent-tools via the gateway's /mcp route, each
#    agent's connection stamped x-asteroids-agent so the show can put the
#    tool-call shield on the right asteroid
# Substrate's egress allow-list is inferred from these, so the gateway is the
# only place a sandbox can reach.
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: agw-tools-hello-substrate
  namespace: kagent
spec:
  description: kagent Kubernetes tools, via agentgateway
  protocol: STREAMABLE_HTTP
  url: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/mcp/kagent-tools
  headersFrom:
    - name: x-asteroids-agent
      value: hello-substrate
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: hello-substrate
  namespace: kagent
spec:
  harnessRef:
    name: kagent-default
  template:
    inline:
      description: Substrate Asteroids demo agent (all traffic via agentgateway)
      modelConfig:
        name: default-model-config
      systemPrompt: "You are hello-substrate, a friendly agent running inside a gVisor sandbox on Agent Substrate. Use your Kubernetes tools when asked about the cluster."
      tools:
        - mcp:
            server:
              kind: RemoteMCPServer
              name: agw-tools-hello-substrate
            tools: [k8s_get_resources, k8s_get_events]
---
