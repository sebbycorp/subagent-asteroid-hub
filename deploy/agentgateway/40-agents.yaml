# Every agent reaches the outside world only through agentgateway:
#  - its model (your qwen3:8b) is reached via the gateway's /qwen route, with
#    a placeholder key (Secret no-real-key); swap models at the gateway
#    (/openai holds the real OpenAI key) without touching the agents
#  - its tools come from kagent-tools via the gateway's /mcp route
# Each agent stamps x-asteroids-agent on every call so the show can put the
# shield on the right asteroid. Substrate's egress allow-list is inferred
# from these, so the gateway is the only place a sandbox can reach.
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: agw-hello-substrate
  namespace: kagent
spec:
  provider: OpenAI
  model: qwen3:8b
  stream: true
  apiKeySecret: no-real-key
  apiKeySecretKey: OPENAI_API_KEY
  defaultHeaders:
    x-asteroids-agent: hello-substrate
  openAI:
    baseUrl: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/qwen/v1
    reasoningEffort: none
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: agw-tools-hello-substrate
  namespace: kagent
spec:
  description: kagent Kubernetes tools, via agentgateway
  protocol: STREAMABLE_HTTP
  url: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/mcp/kagent-tools
  headersFrom:
    - name: x-asteroids-agent
      value: hello-substrate
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: hello-substrate
  namespace: kagent
spec:
  harnessRef:
    name: kagent-default
  template:
    inline:
      description: Substrate Asteroids demo agent (all traffic via agentgateway)
      modelConfig:
        name: agw-hello-substrate
      systemPrompt: "You are hello-substrate, a friendly agent running inside a gVisor sandbox on Agent Substrate. Use your Kubernetes tools when asked about the cluster."
      tools:
        - mcp:
            server:
              kind: RemoteMCPServer
              name: agw-tools-hello-substrate
            tools: [k8s_get_resources, k8s_get_events]
---
