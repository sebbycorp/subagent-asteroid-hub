# kagent-tools' service account can read every Secret in the cluster. No agent
# needs them, so the gateway refuses any tool call that names Secrets: reads
# (which run without approval) can't leak values, and writes can't touch them.
# CEL sees the tool's name but not its arguments, so the rule matches the
# JSON-RPC body: any mention of "secret" in any case, or any \u escape (which
# could spell it in disguise; Kubernetes tool calls don't need them).
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: kagent-tools-no-secrets
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: kagent-tools
  backend:
    mcp:
      authorization:
        action: Deny
        policy:
          matchExpressions:
            - 'string(request.body).lowerAscii().contains("secret") || string(request.body).contains("\\u")'
