# Relays the kind network to Ollama on this Mac (bound to 127.0.0.1).
# Ollama only accepts Host: localhost, so the relay presents that.
server {
  listen 11434;
  location / {
    proxy_pass http://host.docker.internal:11434;
    proxy_set_header Host localhost:11434;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
