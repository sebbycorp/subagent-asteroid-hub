# Helm values for kagent: the built-in tool server (kagent-tools) ships as
# cluster-admin. Narrow it to the chart's read-only role: the usual resources,
# never Secrets. It may change things only in the `playground` namespace
# (deploy/agentgateway/45-k8s-operator.yaml), so an approved change can't
# mount another namespace's Secrets or borrow a powerful service account.
kagent-tools:
  rbac:
    readOnly: true
    allowSecrets: false
    additionalRules: []
